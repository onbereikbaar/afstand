
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afstand</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: 75px auto;
  padding: 25px;
  text-align: center;
}

h1 {
  font-size: 48px;
  letter-spacing: -2px;
}

p {
  color: #888;
}

.browser {
  margin-top: 35px;
  padding: 14px;
  background: #181818;
  border: 1px solid #303030;
  border-radius: 12px;
}

.browser:fullscreen {
  background: #080808;
  border: none;
  border-radius: 0;
  padding: 25px;
}

.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.address {
  flex: 1;
  min-width: 180px;
  padding: 14px;
  background: #090909;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
  font-size: 15px;
}

button {
  padding: 13px 17px;
  background: white;
  color: black;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #ccc;
}

.browser button {
  white-space: nowrap;
}

.preview {
  margin-top: 15px;
  width: 100%;
  height: 500px;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 8px;
  overflow: hidden;
}

.preview iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

#message {
  color: #999;
  font-size: 13px;
  margin-top: 12px;
}

#backend-status {
  margin-top: 20px;
  font-size: 13px;
}

@media (max-width: 600px) {
  main {
    margin: 35px auto;
  }

  .preview {
    height: 400px;
  }
}
</style>
</head>

<body>

<main>

  <h1>Afstand</h1>
  <p>Chop Rice, Chop Rice.</p>

  <div class="browser" id="browser">

    <div class="toolbar">

      <button onclick="goBack()" title="Terug">←</button>

      <button onclick="reloadPage()" title="Vernieuwen">↻</button>

      <input
        class="address"
        id="address"
        type="text"
        placeholder="Voer een eigen testpagina in..."
        value="testpagina.html"
        onkeydown="if(event.key === 'Enter') openPage()"
      >

      <button onclick="openPage()">Open</button>

      <button onclick="toggleFullscreen()" title="Fullscreen">
        ⛶
      </button>

    </div>

    <div class="preview">
      <iframe
        id="viewer"
        src="testpagina.html"
        title="Afstand browser"
      ></iframe>
    </div>

    <p id="message">
      Alleen pagina's van deze eigen website zijn toegestaan.
    </p>

  </div>

  <p id="backend-status">Backend controleren...</p>

</main>

<script>

// Browsernavigatie
let historyList = ["testpagina.html"];
let historyIndex = 0;

function openPage() {
  const input = document.getElementById("address");
  const viewer = document.getElementById("viewer");
  const message = document.getElementById("message");

  let value = input.value.trim();

  try {
    const url = new URL(value, window.location.origin);

    if (url.origin !== window.location.origin) {
      throw new Error("Niet toegestaan");
    }

    if (!url.pathname.endsWith(".html")) {
      throw new Error("Alleen HTML-testpagina's zijn toegestaan");
    }

    const destination = url.pathname + url.search + url.hash;

    historyList = historyList.slice(0, historyIndex + 1);
    historyList.push(destination);
    historyIndex++;

    viewer.src = destination;
    input.value = destination;
    message.textContent = "Pagina geopend.";

  } catch (error) {
    message.textContent =
      "Deze pagina is niet toegestaan. Gebruik een eigen HTML-testpagina.";
  }
}

function goBack() {
  if (historyIndex > 0) {
    historyIndex--;

    const destination = historyList[historyIndex];

    document.getElementById("viewer").src = destination;
    document.getElementById("address").value = destination;
  }
}

function reloadPage() {
  const viewer = document.getElementById("viewer");
  viewer.src = viewer.src;
}

async function toggleFullscreen() {
  const browser = document.getElementById("browser");

  if (!document.fullscreenElement) {
    await browser.requestFullscreen();
  } else {
    await document.exitFullscreen();
  }
}

// Backendcontrole
async function checkBackend() {
  const status = document.getElementById("backend-status");

  try {
    const response = await fetch(
      "https://afstand-backend.burkinafasoo.workers.dev/"
    );

    if (!response.ok) {
      throw new Error("Backend niet bereikbaar");
    }

    const data = await response.json();

    status.textContent = "Afstand backend: " + data.status;

  } catch (error) {
    status.textContent = "Afstand backend: niet bereikbaar";
  }
}

checkBackend();

</script>

</body>
</html>
