
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afstand</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 850px;
  margin: 100px auto;
  padding: 25px;
  text-align: center;
}

h1 {
  font-size: 48px;
  letter-spacing: -2px;
}

p {
  color: #888;
}

.browser {
  margin-top: 40px;
  padding: 12px;
  background: #181818;
  border: 1px solid #303030;
  border-radius: 12px;
}

.browser:fullscreen {
  background: #080808;
  border: none;
  border-radius: 0;
  padding: 30px;
  overflow: auto;
}

.browser:fullscreen .preview {
  min-height: calc(100vh - 180px);
}

.address {
  width: 100%;
  padding: 16px;
  background: #090909;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
  font-size: 15px;
}

button {
  margin-top: 12px;
  padding: 13px 25px;
  background: white;
  color: black;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #ccc;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.preview {
  margin-top: 15px;
  min-height: 250px;
  background: #101010;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
}

#backend-status {
  margin-top: 20px;
  font-size: 13px;
}

</style>
</head>

<body>

<main>
  <h1>Afstand</h1>
  <p>Chop Rice, Chop Rice.</p>

  <div class="browser" id="browser">

    <button onclick="toggleFullscreen()">
      ⛶ Fullscreen
    </button>

    <input
      class="address"
      type="text"
      placeholder="Voer een toegestane testwebsite in..."
      disabled
    >

    <button disabled>Open website</button>

    <div class="preview">
      Testomgeving nog niet gekoppeld.
    </div>

  </div>

  <p id="backend-status">Backend controleren...</p>
</main>

<script>
async function checkBackend() {
  const status = document.getElementById("backend-status");

  try {
    const response = await fetch(
      "https://afstand-backend.burkinafasoo.workers.dev/"
    );

    if (!response.ok) {
      throw new Error("Backend niet bereikbaar");
    }

    const data = await response.json();

    status.textContent =
      "Afstand backend: " + data.status;

  } catch (error) {
    status.textContent =
      "Afstand backend: niet bereikbaar";
  }
}

async function toggleFullscreen() {
  const browser = document.getElementById("browser");

  try {
    if (!document.fullscreenElement) {
      await browser.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Fullscreen kon niet worden gestart:", error);
  }
}

checkBackend();
</script>

</body>
</html>
